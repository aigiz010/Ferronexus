name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # Текстуры приходят как tools/textures.b64 (строка: путь base64). Превращаем в PNG и коммитим в main.
      - name: Decode textures
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -f tools/textures.b64 ]; then
            while read -r path data; do
              [ -z "$path" ] && continue
              mkdir -p "$(dirname "$path")"
              echo "$data" | base64 -d > "$path"
            done < tools/textures.b64
            git config user.name "ferronexus-ci"
            git config user.email "ci@users.noreply.github.com"
            git rm -q tools/textures.b64
            git add src/main/resources/assets
            git commit -qm "Текстуры 32x32 (PNG)"
            git push -q origin HEAD:main
          fi

      - name: Resolve NeoForge version
        id: neo
        shell: bash
        run: |
          wanted=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml -o meta.xml || true
          grep -oE '<version>[^<]+</version>' meta.xml | sed -E 's#</?version>##g' > versions.txt || true
          grep -E '^26\.' versions.txt | tail -60 > versions26.txt || true
          if grep -qx "$wanted" versions.txt; then v="$wanted"; else v=$(grep -E '^26\.3\.' versions.txt | tail -1); fi
          [ -z "$v" ] && v="$wanted"
          echo "wanted=$wanted resolved=$v" | tee neo.txt
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace -Pneo_version=${{ steps.neo.outputs.version }} 2>&1 | tee build.log

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ferronexus-jar
          path: build/libs/*.jar

      # Сигнатуры ключевых классов игры/NeoForge — чтобы чинить код под точный API.
      - name: Dump API
        if: always()
        shell: bash
        run: |
          CP=$(find build ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -iE 'neoforge|minecraft' | grep -viE 'sources|javadoc' | tr '\n' ':')
          for j in $(echo "$CP" | tr ':' ' '); do unzip -Z1 "$j" 2>/dev/null; done | grep -vE '^patches/' | grep -E 'client/renderer/(SubmitNodeCollector|OrderedSubmitNodeCollector|SubmitNodeStorage|ItemBlockRenderTypes)|client/renderer/block/|client/renderer/rendertype/RenderTypes|client/renderer/state/|client/renderer/block/model/BlockStateModel|client/renderer/block/model/BlockModelPart|client/renderer/texture/OverlayTexture|client/renderer/LightCoordsUtil|client/renderer/LevelRenderer\.class|client/Minecraft\.class' | sort -u > classes.txt || true
          LIST=$(grep -E 'client/renderer/(SubmitNodeCollector|OrderedSubmitNodeCollector)[^/]*\.class|client/renderer/block/[^/]*\.class|client/renderer/block/model/(BlockStateModel|BlockModelPart)\.class|client/renderer/state/[^/]*(Moving|Block)[^/]*\.class|client/renderer/rendertype/RenderTypes\.class|client/renderer/texture/OverlayTexture\.class|client/renderer/ItemBlockRenderTypes\.class' classes.txt | sed 's#/#.#g; s#\.class$##' | tr '\n' ' ')
          for c in $LIST; do
            echo "=== $c"; javap -cp "$CP" "$c" 2>&1 | grep -vE '^\s*(private|static \{\})' | head -120 || true
          done > api.txt
          echo "=== Minecraft (block/render getters)" >> api.txt
          javap -cp "$CP" net.minecraft.client.Minecraft 2>&1 | grep -iE 'block|render|model' | head -60 >> api.txt || true

      - name: Publish build log
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p /tmp/out
          [ -f build.log ] && cp build.log /tmp/out/build.log || echo "no log" > /tmp/out/build.log
          cp neo.txt versions26.txt api.txt classes.txt /tmp/out/ 2>/dev/null || true
          grep -nE -A3 "error:|FAILED|What went wrong|Could not" /tmp/out/build.log | head -400 > /tmp/out/errors.txt || true
          echo "status=${{ job.status }}" > /tmp/out/status.txt
          echo "commit=${{ github.sha }}" >> /tmp/out/status.txt
          echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/out/status.txt
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q
          git checkout -q -b build-log
          git config user.name "ferronexus-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ job.status }} for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
