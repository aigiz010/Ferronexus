name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Decode textures
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -f tools/textures.b64 ]; then
            while read -r path data; do
              [ -z "$path" ] && continue
              mkdir -p "$(dirname "$path")"
              echo "$data" | base64 -d > "$path"
            done < tools/textures.b64
            git config user.name "ferronexus-ci"
            git config user.email "ci@users.noreply.github.com"
            git rm -q tools/textures.b64
            git add src/main/resources/assets
            git commit -qm "Текстуры 32x32 (PNG)"
            git push -q origin HEAD:main
          fi

      - name: Resolve NeoForge version
        id: neo
        shell: bash
        run: |
          wanted=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml -o meta.xml || true
          grep -oE '<version>[^<]+</version>' meta.xml | sed -E 's#</?version>##g' > versions.txt || true
          grep -E '^26\.' versions.txt | tail -60 > versions26.txt || true
          if grep -qx "$wanted" versions.txt; then v="$wanted"; else v=$(grep -E '^26\.3\.' versions.txt | tail -1); fi
          [ -z "$v" ] && v="$wanted"
          echo "wanted=$wanted resolved=$v" | tee neo.txt
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace -Pneo_version=${{ steps.neo.outputs.version }} -Pbuild_number=${{ github.run_number }} 2>&1 | tee build.log

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ferronexus-jar
          path: build/libs/*.jar

      - name: Dump API
        if: always()
        shell: bash
        run: |
          CP=$(find build ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -iE 'neoforge|minecraft' | grep -viE 'sources|javadoc' | tr '\n' ':')
          for j in $(echo "$CP" | tr ':' ' '); do unzip -Z1 "$j" 2>/dev/null; done | grep -vE '^patches/' | grep -E 'client/renderer/block/dispatch/|client/resources/model/geometry/BakedQuad|blaze3d/vertex/(QuadInstance|VertexConsumer)|client/resources/model/ModelManager|client/renderer/block/model/BlockDisplayContext|client/renderer/block/model/BlockModel\.class|neoforge/client/extensions/IBlockStateModelExtension|neoforge/client/extensions/IVertexConsumerExtension|client/renderer/texture/TextureAtlas\.class|client/renderer/LightCoordsUtil|client/renderer/LightTexture|client/renderer/rendertype/RenderType\.class|client/renderer/item/ItemModelResolver' | sort -u > classes.txt || true
          LIST=$(grep -E '\.class$' classes.txt | grep -vE '\$[0-9]+\.class$' | sed 's#/#.#g; s#\.class$##' | tr '\n' ' ')
          for c in $LIST; do
            echo "=== $c"; javap -cp "$CP" "$c" 2>&1 | grep -vE '^\s*(private|static \{\})' | head -80 || true
          done > api.txt

      - name: Dump storage-network API
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p sn && cd sn
          : > ../sn_api.txt
          for base in https://modmaven.dev/org/appliedenergistics/appliedenergistics2 https://maven.neoforged.net/releases/org/appliedenergistics/appliedenergistics2; do
            curl -fsSL "$base/maven-metadata.xml" -o meta.xml && break
          done
          echo "base=$base" >> ../sn_api.txt
          grep -oE '<version>[^<]+</version>' meta.xml | sed -E 's#</?version>##g' | grep -E '^26\.' | tail -30 > vers.txt
          cat vers.txt >> ../sn_api.txt
          v=$(grep -E '^26\.3' vers.txt | tail -1); [ -z "$v" ] && v=$(tail -1 vers.txt)
          echo "chosen=$v" >> ../sn_api.txt
          curl -fsSL "$base/$v/appliedenergistics2-$v.jar" -o sn.jar || curl -fsSL "$base/$v/appliedenergistics2-$v-api.jar" -o sn.jar
          ls -la >> ../sn_api.txt
          CP="sn.jar:$(find ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -iE 'neoforge|minecraft' | grep -viE 'sources|javadoc' | tr '\n' ':')"
          unzip -Z1 sn.jar | grep -E '^appeng/api/(networking/(IInWorldGridNodeHost|IGridNode|IManagedGridNode|GridHelper|GridFlags|IGridNodeListener|IGridConnection)|util/AECableType|AECapabilities)' | grep -E '\.class$' | grep -vE '\$[0-9]+\.class$' > snclasses.txt
          unzip -Z1 sn.jar | grep -E '^appeng/api/' | grep -iE 'capab|gridhelper|nodehost' >> ../sn_api.txt
          for c in $(sed 's#/#.#g; s#\.class$##' snclasses.txt); do
            echo "=== $c"; javap -cp "$CP" "$c" 2>&1 | head -80
          done >> ../sn_api.txt
          true

      - name: Publish build log
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p /tmp/out
          [ -f build.log ] && cp build.log /tmp/out/build.log || echo "no log" > /tmp/out/build.log
          cp neo.txt versions26.txt api.txt classes.txt sn_api.txt /tmp/out/ 2>/dev/null || true
          grep -nE -A3 "error:|FAILED|What went wrong|Could not" /tmp/out/build.log | head -400 > /tmp/out/errors.txt || true
          echo "status=${{ job.status }}" > /tmp/out/status.txt
          echo "version=0.2.${{ github.run_number }}" >> /tmp/out/status.txt
          echo "commit=${{ github.sha }}" >> /tmp/out/status.txt
          echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/out/status.txt
          for j in build/libs/*.jar; do
            [ -f "$j" ] || continue
            cp "$j" /tmp/out/
            cp "$j" /tmp/out/ferronexus-latest.jar
          done
          cd /tmp/out
          git init -q
          git checkout -q -b build-log
          git config user.name "ferronexus-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ job.status }} v0.2.${{ github.run_number }} for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
