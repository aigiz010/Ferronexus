plugins {
    id 'java-library'
    id 'idea'
    // Сверьте версию плагина с официальным MDK для 26.3
    id 'net.neoforged.moddev' version '2.0.+'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)


neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data { clientData() }
        configureEach { systemProperty 'forge.logging.console.level', 'debug' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // Подсказки при наведении — необязательная зависимость, только для компиляции
    compileOnly 'curse.maven:jade-324717:9042207'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 neo_version: neo_version, loader_version_range: loader_version_range,
                 mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                 mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
